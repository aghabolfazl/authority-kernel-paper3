[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "authority-kernel-paper3"
version = "0.1.0"
description = "Research reference implementation for an AI actuation authority boundary"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Abolfazl Erfani"}]
keywords = ["autonomous vehicles", "runtime assurance", "capability security", "AI safety"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Scientific/Engineering"]

[tool.setuptools.packages.find]
include = ["authority_kernel*"]
