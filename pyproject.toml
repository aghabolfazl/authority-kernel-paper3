[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "authority-kernel"
version = "0.1.0"
description = "Research reference implementation of a default-deny authority boundary"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Abolfazl Erfani" }]
[tool.setuptools.packages.find]
include = ["authority_kernel*"]
